; CakeGame — Windows Desktop export preset
;
; One artefact and one only: `build/CakeGame.exe`. `binary_format/embed_pck`
; stuffs the packed game inside the executable, so there is no sibling .pck to
; lose, and the file can be moved anywhere on its own. That is what Planning.md
; asks for ("单文件 exe").
;
; `exclude_filter` keeps the verification scaffolding out of the shipped build:
; the test suites, the layout probe, the screenshot rig and the sprite/font
; generators are development tools, not game content. They are all reachable
; only from their own scenes, which are excluded with them.
;
; `include_filter` is NOT optional. `export_filter="all_resources"` ships every
; file the engine recognises as a resource, and it does not recognise `.py` or
; `.btp` - so `assets/btps_runtime/` (the vendored BTPS implementation plus
; `bridge.py`) and the sample `.btp` were silently left out of the exe. The
; plugin host would then boot, fail to find `bridge.py`, and sit in ERROR
; forever in the shipped build while every test still passed, because the tests
; run from the project directory where those files do exist on disk.
; That is the worst shape of bug: green CI, dead feature in the product.
;
; Version numbers are the four-segment Windows form. Keep
; `application/file_version` in step with `config/version` in project.godot.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.py, *.btp, assets/btps_samples/*"
exclude_filter="_check/*, _shot/*, tests/*, tools/*, Planning/*, build/*, server/*, promo/*, .workbuddy/*"
export_path="build/CakeGame.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://assets/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="kscm"
application/product_name="CakeGame"
application/file_description="CakeGame - 2D top-down pixel action battle"
application/copyright="Available License - license.kscm.top"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

